<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chart</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; }
        #chart-container { width: 100vw; height: 100vh; }
        #watermark { position: absolute; top: 10px; left: 20px; font-size: 24px; font-weight: bold; color: rgba(255, 255, 255, 0.5); z-index: 10; pointer-events: none;}
    </style>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div id="watermark"></div>
    <div id="chart-container"></div>
    <script>
        window.chartReady = false;
        const urlParams = new URLSearchParams(window.location.search);
        const symbol = urlParams.get('symbol');
        document.getElementById('watermark').innerText = symbol + ' - 3 Year Daily Chart';

        if (!symbol) {
            document.body.innerText = 'No symbol provided';
            window.chartReady = true;
        } else {
            const chartOptions = {
                layout: { textColor: '#d1d4dc', background: { type: 'solid', color: '#1a1a1a' } },
                grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                rightPriceScale: { borderColor: '#2B2B43' },
                timeScale: { borderColor: '#2B2B43', timeVisible: true }
            };
            const chart = LightweightCharts.createChart(document.getElementById('chart-container'), chartOptions);
            const candlestickSeries = chart.addCandlestickSeries({
                upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
                wickUpColor: '#26a69a', wickDownColor: '#ef5350'
            });

            // Add volume series
            const volumeSeries = chart.addHistogramSeries({
                color: '#26a69a',
                priceFormat: { type: 'volume' },
                priceScaleId: '', // set as an overlay by setting a blank priceScaleId
            });
            volumeSeries.priceScale().applyOptions({
                scaleMargins: { top: 0.8, bottom: 0 },
            });

            fetch(`/api/history/${symbol}`)
                .then(r => r.json())
                .then(data => {
                    const cData = [];
                    const vData = [];
                    data.forEach(item => {
                        const t = item.time;
                        cData.push({ time: t, open: item.open, high: item.high, low: item.low, close: item.close });
                        vData.push({ time: t, value: item.value, color: item.close >= item.open ? '#26a69a80' : '#ef535080' });
                    });
                    candlestickSeries.setData(cData);
                    volumeSeries.setData(vData);

                    // Fit all data
                    chart.timeScale().fitContent();
                    setTimeout(() => {
                        window.chartReady = true;
                    }, 500);
                })
                .catch(e => {
                    console.error(e);
                    window.chartReady = true;
                });
        }
    </script>
</body>
</html>
